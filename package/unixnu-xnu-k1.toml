version = 1

[boot]
timeout = -1
fallback_timeout = 3600
default = "xnu"
rotate = 0
connect_all = true

[ui]
title = "Mi 10S K1 read-only UFS bring-up"

[kits]
autoload = false

[[entry]]
id = "xnu"
title = "K1: verify read-only UFS root"
type = "xnu"
path = "Payloads/kernel.macho"
args = "-v keepsyms=1 kt_fixed_zones=120 native-ufs-root=1 sheng-data-persist=0 umi-user-log=0"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
